server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 16.176.182.103 panvibesonline.com www.panvibesonline.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/panpops-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://panvibesonline.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panvibesonline.com;
    server_tokens off;
    client_max_body_size 64k;

    ssl_certificate /etc/letsencrypt/live/panvibesonline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panvibesonline.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:panpops_tls:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://checkout.razorpay.com; connect-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://*.razorpay.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/panpops.access.log;
    error_log /var/log/nginx/panpops.error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.panvibesonline.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/panvibesonline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panvibesonline.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://panvibesonline.com$request_uri;
}

